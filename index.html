        <link rel="stylesheet" href="moviesstyle.css">
        <style>
/*this is my internal style sheet! Yay!*/

.highlight {
	background-color: pink;
}

.indent {
	text-indent: 20%;
}

#shape {
	list-style-type: square;
}

.poetry {
	text-align: center;
}

@media (min-width: 500px) {
	.item1 {
		grid-area: item1;
	}

	.item2 {
		grid-area: item2;
	}

	.item3 {
		grid-area: item3;
	}

	.item4 {
		grid-area: item4;
	}

	.item5 {
		grid-area: item5;
	}

	.item6 {
		grid-area: item6;
	}

	.item7 {
		grid-area: item7;
	}

	.item8 {
		grid-area: item8;
	}

	.item9 {
		grid-area: item9;
	}

	.container {
		display: grid;
		margin: 30px auto;
		grid-template-columns: auto auto auto;
		grid-template-rows: auto auto auto;
		background-color: lightcyan;
		max-width: calc(100vw - 60px);
		gap: 10px;
		border: 2px solid #0471b1ff;
		padding: 10px;
		grid-template-areas:
			'item1 item2 item3'
			'item1 item5 item6'
			'item1 item8 item8';
	}

	.container div {
		background-color: lightcyan;
		color: #0471b1ff;
		text-align: center;
		padding: 10px;
	}

	.container p {
		background-color: lightcyan;
		color: #0471b1ff;
	}

	.item4 {
		display: none;
	}

	.item7 {
		display: none;
	}

	.item9 {
		display: none;
	}
}

.Table,
.Table Td,
.Table Th {
	background-color: rgba(247, 185, 220, 1);
	border: 1px solid rgba(144, 0, 255, 1);
	border-collapse: collapse;
	margin: auto;
	padding: 10px;
}

.hide {
	display: none;
}

.source {
	text-align: center;
}

.Table tfoot {
	font-weight: bold;
}

nav.mainmenu {
	margin: auto;
	border: solid 5px #3742bcff;
	text-align: center;
	background-color: #908dffff;
	position: relative;
}

.nav-toggle {
	position: absolute;
	opacity: 0;
	pointer-events: none;
}

.hamburger {
	display: none;
	width: 32px;
	padding: 4px;
	margin: 0 auto;
	cursor: pointer;
}

.bar {
	display: block;
	width: 100%;
	height: 3px;
	margin: 5px 0;
	background: #010214ff;
	border-radius: 2px;
}

.mainmenu ul {
	margin: 0;
	padding: 0;
	display: flex;
	justify-content: center;
	gap: 5px;
}

@media (min-width: 900px) {
	nav.mainmenu {
		padding: 20px 0;
	}

	.mainmenu ul {
		gap: 30px;
	}
}

.mainmenu li {
	list-style-type: none;
}

.mainmenu a {
	color: #010214ff;
	text-decoration: none;
	display: block;
	padding: 5px 10px;
}

.mainmenu a:hover {
	background-color: #3742bcff;
	color: rgba(0, 255, 217, 1);
}

@media (max-width: 600px) {
	.hamburger {
		display: block;
	}

	.mainmenu ul {
		display: none;
		flex-direction: column;
		gap: 0;
	}

	.nav-toggle:checked~ul {
		display: flex;
	}

	.mainmenu a {
		width: 100%;
		padding: 10px;
		border-top: 1px solid #3742bcff;
	}
}

.video {
	position: relative;
	padding-bottom: 56.25%;
	padding-top: 30px;
	height: 0;
	overflow: hidden;
}

.video iframe {
	position: absolute;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
}
.movies {
    text-align: center;
}

</style>
